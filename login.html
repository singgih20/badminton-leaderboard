<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Badmin Stat</title><style>body{background:#f4f7f5;font:16px system-ui;display:grid;place-items:center;min-height:90vh}main{background:white;padding:30px;border-radius:18px;max-width:360px;width:90%;box-shadow:0 4px 30px #0001}input,button{padding:12px;border-radius:10px;width:100%;box-sizing:border-box;margin-top:12px}input{border:1px solid #ddd}button{background:#16794b;color:white;border:0;cursor:pointer}</style><main><h2>🏸 Badmin Stat</h2><p>Login Super Admin</p><form id="f"><input id="password" type="password" placeholder="Password admin" required autocomplete="current-password"><button>Masuk</button></form><p id="msg"></p></main><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(r.ok)location.href='/admin';else document.getElementById('msg').textContent=(await r.json()).error}</script></html>
